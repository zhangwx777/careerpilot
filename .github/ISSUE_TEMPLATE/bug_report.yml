name: 缺陷报告
description: 报告可复现的产品缺陷
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "请勿粘贴 API Key、密码、简历、个人资料或真实求职记录。安全问题请走私密报告渠道。"
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小且可重复的操作步骤。
      placeholder: "1. 打开… 2. 选择… 3. 观察…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CareerPilot 版本
      placeholder: "例如 0.1.5"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统及使用方式（Windows 安装包、便携包或 Docker）。
    validations:
      required: true
